name: olivares_pilates
description: "Olivares Pilates: alunos e aulas do estúdio com Firebase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^4.6.0
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.0.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagens/logo_olivares.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fontes/Manrope-Variable.ttf
    - family: Epilogue
      fonts:
        - asset: assets/fontes/Epilogue-Variable.ttf
